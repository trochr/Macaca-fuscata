<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macaca fuscata</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: black;
        }
        video {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <video width="100%" autoplay muted playsinline>
        <source src="Macaca%20fuscata.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <script>
        const video = document.querySelector('video');

        video.addEventListener('ended', () => {
            console.log('[video] ended — switching to reverse');
            video.playbackRate = -1;
            video.play();
        });

        video.addEventListener('timeupdate', () => {
            if (video.playbackRate < 0 && video.currentTime <= 0) {
                console.log('[video] reverse done — switching to forward');
                video.playbackRate = 1;
                video.play();
            }
        });
    </script>
</body>
</html>
