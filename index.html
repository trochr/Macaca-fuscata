<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macaca fuscata</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: black;
        }
        video {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <video width="100%" autoplay muted playsinline>
        <source src="Macaca%20fuscata.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <script>
        const video = document.querySelector('video');
        const forwardSrc = 'Macaca%20fuscata.mp4';
        const reverseSrc = 'Macaca%20fuscata%20reversed.mp4';

        video.addEventListener('ended', () => {
            const isForward = !video.currentSrc.includes('reversed');
            console.log(`[video] ended — switching to ${isForward ? 'reverse' : 'forward'}`);
            video.src = isForward ? reverseSrc : forwardSrc;
            video.play();
        });
    </script>
</body>
</html>
