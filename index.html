<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macaca fuscata</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: black;
        }
        video {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <video width="100%" autoplay muted playsinline>
        <source src="Macaca%20fuscata.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <script>
        const video = document.querySelector('video');
        let lastLoggedSecond = -1;

        video.addEventListener('loadedmetadata', () => {
            console.log(`[video] metadata loaded — duration: ${video.duration.toFixed(2)}s`);
            video.play();
        });

        video.addEventListener('play', () => {
            console.log(`[video] play fired — currentTime: ${video.currentTime.toFixed(2)}`);
        });

        video.addEventListener('timeupdate', () => {
            const second = Math.floor(video.currentTime);
            if (second !== lastLoggedSecond) {
                lastLoggedSecond = second;
                console.log(`[forward] currentTime: ${video.currentTime.toFixed(2)}s — remaining: ${(video.duration - video.currentTime).toFixed(2)}s`);
            }
        });

        video.addEventListener('ended', () => {
            console.log('[video] ended');
        });
    </script>
</body>
</html>
